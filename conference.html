<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conference Baseball News · Division I Baseball Newsroom</title>
<style>
  :root{--night:#101827;--blue:#2473b7;--paper:#f5f5f2;--ink:#17212b;--muted:#627080;--line:#d7d9dc;--gold:#f3b23c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}.masthead{background:var(--night);color:#fff;padding:25px max(24px,calc((100vw - 1120px)/2));border-bottom:5px solid var(--gold)}.back{display:inline-block;color:#f6cb70;font:700 11px Arial,sans-serif;letter-spacing:.13em;text-decoration:none;text-transform:uppercase;margin-bottom:16px}.title-row{display:flex;align-items:center;gap:15px}.logo{width:52px;height:52px;object-fit:contain;border-radius:50%;background:#fff;border:1px solid #ced5df;padding:4px}.title-copy h1{font-size:clamp(2rem,5vw,3.8rem);letter-spacing:-.06em;line-height:.9;margin:0}.sub{margin:9px 0 0;font:14px/1.4 Arial,sans-serif;color:#cbd4df}main{max-width:1120px;margin:auto;padding:30px 24px 60px}.status{font:12px Arial,sans-serif;color:var(--muted);padding-bottom:21px;border-bottom:1px solid var(--line)}.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-top:28px}.post{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);transition:transform .16s,box-shadow .16s}.post:hover{transform:translateY(-4px);box-shadow:0 9px 22px #18202b18}.image{aspect-ratio:16/9;background:linear-gradient(130deg,#dfe6e6,#b8c3c8);overflow:hidden}.image img{width:100%;height:100%;object-fit:cover;display:block}.copy{padding:15px}.date{font:700 10px Arial,sans-serif;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.post h2{font-size:21px;line-height:1.05;letter-spacing:-.03em;margin:9px 0}.excerpt{font:13px/1.4 Arial,sans-serif;color:#5b6875;margin:0}.error{font:14px Arial,sans-serif;color:#9d2d29;background:#fff0ed;padding:12px;margin-top:24px}@media(max-width:760px){.posts{grid-template-columns:repeat(2,1fr);gap:12px}.post h2{font-size:17px}}@media(max-width:470px){.posts{grid-template-columns:1fr}.masthead{padding-top:21px}}
</style>
</head>
<body>
<header class="masthead"><a class="back" href="index.html">← All conference news</a><div class="title-row"><img class="logo" id="logo" alt=""><div class="title-copy"><h1 id="title">Conference Baseball</h1><p class="sub" id="description">Expanded conference coverage.</p></div></div></header>
<main><div class="status" id="status">Loading conference coverage…</div><div class="posts" id="posts"></div></main>
<script>
const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const date=s=>{try{return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(new Date(s))}catch{return s||''}};function emptyImage(title){return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450"><rect width="100%" height="100%" fill="#dbe2e4"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="#14233a" font-family="Georgia" font-size="28">${title.replace(/[<&>]/g,'')}</text></svg>`)}`};async function load(){const slug=new URLSearchParams(location.search).get('conference');try{const response=await fetch(`data.json?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw Error('No dashboard data yet');const data=await response.json();const section=data.sections.find(s=>s.slug===slug);if(!section)throw Error('That conference page is unavailable.');document.title=`${section.name} News · Division I Baseball Newsroom`;document.querySelector('#title').textContent=section.name;document.querySelector('#description').textContent=`${section.description} · ${section.allPosts.length} latest stories`;const logo=document.querySelector('#logo');logo.src=section.logo;logo.alt=`${section.name} logo`;logo.onerror=()=>logo.style.visibility='hidden';document.querySelector('#status').textContent=`Last updated ${new Date(data.refreshedAt).toLocaleString()} · ${section.allPosts.length} expanded stories`;document.querySelector('#posts').innerHTML=section.allPosts.map(p=>`<a class="post" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="image"><img src="${esc(p.image||emptyImage(section.name))}" alt="" loading="lazy" onerror="this.src='${emptyImage(section.name)}'"></div><div class="copy"><div class="date">${esc(date(p.published))}</div><h2>${esc(p.title)}</h2><p class="excerpt">${esc(p.excerpt)}</p></div></a>`).join('')}catch(error){document.querySelector('#status').textContent='Unable to load this conference page.';document.querySelector('#posts').innerHTML=`<p class="error">${esc(error.message)}</p>`}}load();
</script></body></html>
