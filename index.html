<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Division I Baseball Newsroom</title>
<style>
  :root{--night:#101827;--blue:#2473b7;--paper:#f5f5f2;--ink:#17212b;--muted:#627080;--line:#d7d9dc;--gold:#f3b23c}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
  .masthead{background:var(--night);color:#fff;padding:32px max(24px,calc((100vw - 1460px)/2));border-bottom:5px solid var(--gold);display:flex;align-items:end;justify-content:space-between;gap:30px}.eyebrow{font:700 11px/1.2 Arial,sans-serif;letter-spacing:.18em;color:#f6cb70;margin:0 0 10px;text-transform:uppercase}h1{font-size:clamp(2.25rem,5vw,4.6rem);letter-spacing:-.07em;line-height:.84;margin:0}.sub{max-width:700px;margin:14px 0 0;font:15px/1.4 Arial,sans-serif;color:#cbd4df}.refresh{appearance:none;background:#fff;color:var(--night);border:0;border-radius:3px;padding:13px 16px;cursor:pointer;font:700 12px Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}.refresh:hover{background:#f6cb70}
  main{max-width:1460px;margin:auto;padding:30px 24px 60px}.status{font:12px Arial,sans-serif;color:var(--muted);padding-bottom:22px;border-bottom:1px solid var(--line)}.section{padding:31px 0;border-bottom:1px solid var(--line)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:17px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.brand:hover h2{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}.logo{width:34px;height:34px;object-fit:contain;border-radius:50%;background:#fff;border:1px solid var(--line);padding:3px}.section h2{margin:0;font-size:25px;letter-spacing:-.04em}.conference{font:700 11px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);text-align:right}.more{display:inline-block;margin-top:16px;color:var(--blue);font:700 11px Arial,sans-serif;letter-spacing:.12em;text-decoration:none;text-transform:uppercase}.more:hover{text-decoration:underline}.posts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.post{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);min-width:0;transition:transform .16s,box-shadow .16s}.post:hover{transform:translateY(-4px);box-shadow:0 9px 22px #18202b18}.image{width:100%;aspect-ratio:16/9;background:linear-gradient(130deg,#dfe6e6,#b8c3c8);overflow:hidden}.image img{width:100%;height:100%;object-fit:cover;display:block}.copy{padding:13px}.date{font:700 10px Arial,sans-serif;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;min-height:12px}.title{font-size:17px;line-height:1.06;letter-spacing:-.025em;margin:9px 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.excerpt{font:12px/1.35 Arial,sans-serif;color:#5b6875;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.error{font:14px Arial,sans-serif;color:#9d2d29;background:#fff0ed;padding:12px}@media(max-width:1050px){.posts{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.masthead{align-items:start;flex-direction:column;padding-top:24px}.posts{grid-template-columns:repeat(2,1fr);gap:10px}.section{padding:24px 0}.section h2{font-size:22px}.title{font-size:15px}.excerpt{display:none}main{padding:20px 14px 45px}}@media(prefers-reduced-motion:reduce){.post{transition:none}}
</style>
</head>
<body>
<header class="masthead"><div><p class="eyebrow">The Division I diamond wire</p><h1>NCAA Baseball<br>Newsroom</h1><p class="sub">The newest national Division I baseball stories plus dedicated SEC, ACC, Big Ten, Big 12 and mid-major coverage.</p></div><a class="refresh" href="https://github.com/hsw10/ncaa-baseball-newsroom/actions/workflows/refresh.yml" target="_blank" rel="noopener" title="Sign in to GitHub, then choose Run workflow to scan and publish updated stories.">↻ Scan &amp; update</a></header>
<main><div class="status" id="status">Loading the latest dispatches…</div><div id="digest"></div></main>
<script>
const digest=document.querySelector('#digest'),status=document.querySelector('#status');
const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const date=s=>{try{return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(new Date(s))}catch{return s||''}};function emptyImage(title){return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450"><rect width="100%" height="100%" fill="#dbe2e4"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="#14233a" font-family="Georgia" font-size="28">${title.replace(/[<&>]/g,'')}</text></svg>`)}`}
async function load(){try{const res=await fetch(`data.json?t=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw Error('No dashboard data yet');const data=await res.json();status.textContent=`Last updated ${new Date(data.refreshedAt).toLocaleString()} · Use Scan & update to run a new manual scan.`;digest.innerHTML=data.sections.map(section=>{const detail=`conference.html?conference=${encodeURIComponent(section.slug)}`;const countLabel=`Latest ${section.posts.length}`;return `<section class="section"><div class="section-head"><a class="brand" href="${detail}"><img class="logo" src="${esc(section.logo)}" onerror="this.style.visibility='hidden'" alt="${esc(section.name)} logo"><h2>${esc(section.name)}</h2></a><span class="conference">${esc(section.description)}<br>${countLabel}</span></div>${section.status==='error'?`<div class="error">This section could not be updated: ${esc(section.error)}</div>`:`<div class="posts">${section.posts.map(p=>`<a class="post" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="image"><img src="${esc(p.image||emptyImage(section.name))}" alt="" loading="lazy" onerror="this.src='${emptyImage(section.name)}'"></div><div class="copy"><div class="date">${esc(date(p.published))}</div><h3 class="title">${esc(p.title)}</h3><p class="excerpt">${esc(p.excerpt)}</p></div></a>`).join('')}</div><a class="more" href="${detail}">View all ${section.allPosts.length} stories →</a>`}</section>`}).join('')}catch(e){status.textContent='Unable to load the local dashboard.';digest.innerHTML=`<p class="error">${esc(e.message)} Run the update again.</p>`}}load();
</script></body></html>
